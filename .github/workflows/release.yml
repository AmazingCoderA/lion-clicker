name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lion-autoclicker-windows-x86_64
            extension: zip
            cross: false
            experimental: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: lion-autoclicker-windows-aarch64
            extension: zip
            cross: false
            experimental: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lion-autoclicker-linux-x86_64
            extension: tar.gz
            cross: false
            experimental: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: lion-autoclicker-linux-aarch64
            extension: tar.gz
            cross: true
            experimental: false
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: lion-autoclicker-linux-armv7
            extension: tar.gz
            cross: true
            experimental: true
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            name: lion-autoclicker-freebsd-x86_64
            extension: tar.gz
            cross: true
            experimental: true
          - os: macos-14
            target: aarch64-apple-darwin
            name: lion-autoclicker-macos-aarch64
            extension: tar.gz
            cross: false
            experimental: true
          - os: macos-14
            target: x86_64-apple-darwin
            name: lion-autoclicker-macos-x86_64
            extension: tar.gz
            cross: false
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}
      - name: Install Linux libraries
        if: runner.os == 'Linux' && matrix.cross == false
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lion-autoclicker.exe" "dist/${{ matrix.name }}.exe"
          Copy-Item "dist/${{ matrix.name }}.exe" dist/package/lion-autoclicker.exe
          Copy-Item README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.name }}.zip"
          Remove-Item -Recurse -Force dist/package
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/lion-autoclicker" dist/package/
          cp README.md LICENSE dist/package/
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C dist/package .
          cp "target/${{ matrix.target }}/release/lion-autoclicker" "dist/${{ matrix.name }}"
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lion-autoclicker.flatpak
          manifest-path: io.github.lionautoclicker.LionAutoclicker.yml
          cache-key: flatpak-release-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: lion-autoclicker-flatpak
          path: lion-autoclicker.flatpak

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lion-autoclicker-arch
          path: packaging/arch/PKGBUILD

  publish:
    needs: [native, flatpak, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/arch/PKGBUILD
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add Arch PKGBUILD
        run: |
          mkdir -p release
          sed "s/^_commit=.*/_commit=${GITHUB_SHA}/" packaging/arch/PKGBUILD > release/PKGBUILD
      - name: Prepare release metadata
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "RELEASE_TAG=release-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Lion AutoClicker release ${GITHUB_RUN_NUMBER} (${short_sha})" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Ready builds for Lion AutoClicker.

            Готовые сборки Lion AutoClicker.

            This release was built from commit `${{ github.sha }}`.

            Этот релиз собран из коммита `${{ github.sha }}`.

            - Windows: download `lion-autoclicker-windows-x86_64.exe` or `.zip`
            - Windows ARM64: download `lion-autoclicker-windows-aarch64.exe` if present
            - Linux: download `lion-autoclicker-linux-x86_64` or `lion-autoclicker-linux-aarch64`
            - Linux ARMv7: download `lion-autoclicker-linux-armv7` if present
            - macOS: download `lion-autoclicker-macos-aarch64` or `lion-autoclicker-macos-x86_64` if present
            - FreeBSD x86_64: download `lion-autoclicker-freebsd-x86_64` if present
            - Flatpak: download `lion-autoclicker.flatpak`
            - Arch Linux: download `PKGBUILD`
          files: release/*
          make_latest: true
