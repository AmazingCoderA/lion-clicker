app-id: io.github.lionautoclicker.LionAutoclicker
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lion-autoclicker

finish-args:
  # Global input simulation and hotkeys currently use X11/XWayland.
  - --socket=x11
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lion-autoclicker/cargo

modules:
  - name: lion-autoclicker
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/lion-autoclicker /app/bin/lion-autoclicker
      - install -Dm644 packaging/io.github.lionautoclicker.LionAutoclicker.desktop /app/share/applications/io.github.lionautoclicker.LionAutoclicker.desktop
      - install -Dm644 packaging/io.github.lionautoclicker.LionAutoclicker.metainfo.xml /app/share/metainfo/io.github.lionautoclicker.LionAutoclicker.metainfo.xml
      - install -Dm644 packaging/io.github.lionautoclicker.LionAutoclicker.svg /app/share/icons/hicolor/scalable/apps/io.github.lionautoclicker.LionAutoclicker.svg
    sources:
      - cargo-sources.json
      - type: dir
        path: .
        skip:
          - target
          - vendor
          - .flatpak-builder
          - build-dir
          - repo
          - dist
