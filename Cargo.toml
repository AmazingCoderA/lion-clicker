[package]
name = "lion-autoclicker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cross-platform desktop autoclicker with interruptible timing and configurable patterns"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
enigo = { version = "0.3.0", default-features = false }
global-hotkey = "0.7.0"
rand = "0.8.5"
rand_distr = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.20"
toml = "0.8.23"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
enigo = { version = "0.3.0", default-features = false, features = ["x11rb"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
